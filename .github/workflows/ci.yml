name: CI

on:
  pull_request:
  push:
    # Every branch, not only main: the build happens on a working branch whose
    # name the cloud session is given, so no pattern here can be relied on, and
    # "CI green" must never need a pull request. The filter keeps tags out.
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      # LikeC4 runs through `pnpm dlx` (not a mise tool); cache its store so the
      # ~120 MB download happens once per LIKEC4_VERSION bump.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pnpm/dlx
          key: pnpm-dlx-likec4-${{ hashFiles('mise.toml') }}
          restore-keys: pnpm-dlx-likec4-
      # The real-sshd lane (Phase 2) runs here, not in the local sandbox, which
      # has no sshd (spec section 7). Make sure the runner has it; fail if not.
      - name: Ensure sshd is installed
        run: |
          export PATH="$PATH:/usr/sbin"
          command -v sshd || (sudo apt-get update && sudo apt-get install -y openssh-server)
          command -v sshd
      # With YASSHM_REQUIRE_SSHD=1 the gate's sshd step and every real-sshd
      # test fail when sshd is missing, instead of returning early.
      - name: mise run check
        run: mise run check
        env:
          YASSHM_REQUIRE_SSHD: "1"
