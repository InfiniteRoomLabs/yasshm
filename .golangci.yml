version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - revive
    - staticcheck
    - unused
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: unused-parameter
        - name: error-return
        - name: error-naming
        - name: indent-error-flow
        - name: errorf
        - name: context-as-argument
    gocritic:
      enabled-tags:
        - diagnostic
        - style
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
